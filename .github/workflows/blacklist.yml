name: Blacklist non-API entries

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'

permissions: {}

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Required: git-auto-commit-action pushes with the persisted token
          persist-credentials: true
          sparse-checkout: |
            encyclopedia_updater
            reports

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x

      - name: Regenerate blacklist files - anime
        run: task blacklist:generate c=anime

      - name: Regenerate blacklist files - manga
        run: task blacklist:generate c=manga

      - name: Commit changes
        id: auto-commit-action
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          file_pattern: 'encyclopedia_updater/*/*.json'
          commit_message: Update blacklists

name: Encyclopedia

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    - cron: '15 */4 * * *'

permissions: {}

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    strategy:
      matrix:
        category: [anime, manga]
        type: [missing, outdated]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.head_ref }}

      - name: Setup YQ
        uses: mikefarah/yq@f2944b823f84906a127dbd29e4c2a3e60c4e550e # v4.54.3

      - name: Setup JQ
        uses: supplypike/setup-bin@73f5356f4d8a8588c525365fad26435ee1de4eaa # v5.0.2
        with:
          uri: 'https://github.com/jqlang/jq/releases/download/jq-1.8.1/jq-linux-amd64'
          name: 'jq'
          version: '1.8.1'

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run script
        run: python -m encyclopedia_updater -o "/tmp/encyclopedia" -c ${{ matrix.category }} -t ${{ matrix.type }}
        env:
          LOGURU_LEVEL: SUCCESS

      - name: Check directory contents
        id: check-directory
        run: |
          HAS_ENCYCLOPEDIA_FILES=false
          if [ "$(find /tmp/encyclopedia -type f | head -n 1)" ]; then
            HAS_ENCYCLOPEDIA_FILES=true
          fi

          {
            echo has_files=$HAS_ENCYCLOPEDIA_FILES
          } >> "${GITHUB_OUTPUT}"

      - name: Prepare artifact
        id: prepare-encyclopedia
        if: ${{ !failure() && steps.check-directory.outputs.has_files == 'true' }}
        run: |
          echo "ENCYCLOPEDIA=encyclopedia-${{ matrix.category }}-${{ matrix.type }}-$(date +%d-%m-%Y_%H-%M-%S)" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !failure() && steps.check-directory.outputs.has_files == 'true' }}
        with:
          name: ${{ env.ENCYCLOPEDIA }}
          path: /tmp/encyclopedia/
          if-no-files-found: error
          retention-days: 1

  check:
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    needs:
      - process
    outputs:
      has_files: ${{ steps.check-directory.outputs.has_files }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/encyclopedia
          pattern: encyclopedia-*
          merge-multiple: true
          
      - name: Check directory contents
        id: check-directory
        run: |
          if [ ! -d "/tmp/encyclopedia" ]; then
            echo "Artifact directory is empty. Skipping."
            {
              echo has_files=false
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # show files
          find /tmp/encyclopedia -type f
          
          HAS_ENCYCLOPEDIA_FILES=false
          if [ "$(find /tmp/encyclopedia -type f | head -n 1)" ]; then
            HAS_ENCYCLOPEDIA_FILES=true
          fi

          {
            echo has_files=$HAS_ENCYCLOPEDIA_FILES
          } >> "${GITHUB_OUTPUT}"

  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - check
    if: ${{ needs.check.outputs.has_files == 'true' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Required: git-auto-commit-action pushes with the persisted token
          persist-credentials: true
          ref: ${{ github.head_ref }}
          sparse-checkout: |
            /*
            !/encyclopedia/
            !/reports/
          sparse-checkout-cone-mode: false

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/encyclopedia
          pattern: encyclopedia-*
          merge-multiple: true

      - name: Move encyclopedia entries to working directory
        shell: bash
        run: |
          SOURCE_DIRECTORY="/tmp/encyclopedia"
          DESTINATION_DIRECTORY="./encyclopedia"
          # Materialize only the entries being written, so they can be diffed and committed
          ( cd "$SOURCE_DIRECTORY" && find . -type f -printf '/encyclopedia/%P\n' ) | git sparse-checkout add --stdin
          find "$SOURCE_DIRECTORY" -type f | while read -r file; do
              # <category>/<id>.json
              RELATIVE_PATH="${file#"$SOURCE_DIRECTORY"/}"
              mkdir -p "$DESTINATION_DIRECTORY/$(dirname "$RELATIVE_PATH")"
              mv "$file" "$DESTINATION_DIRECTORY/$RELATIVE_PATH"
          done

      - name: Commit changes
        id: auto-commit-action
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          file_pattern: '*.json'
          commit_message: Update encyclopedia entries
